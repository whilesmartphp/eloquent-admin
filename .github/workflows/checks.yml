name: Code checks

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        authentication: ['^1.0', '^2.0']
        exclude:
          - php-version: '8.2'
            authentication: '^2.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite
          coverage: none
      - name: Install dependencies
        run: |
          composer config platform.php '${{ matrix.php-version }}'
          composer require 'whilesmart/laravel-user-authentication:${{ matrix.authentication }}' --with-all-dependencies --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Run tests
        run: vendor/bin/testbench package:test
      - name: Run linter test
        run: composer pint:test
